name: NUnit.Engine.Api.CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  checks: write

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry

jobs:
  build-windows:
    name: Continuous Integration Windows Build
    runs-on: windows-latest

    steps:
    - name: ⤵️ Checkout Source
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
        
    - name: 🛠️ Install dotnet tools
      run: dotnet tool restore

    - name: 🔨 Build, Test and Package
      run: dotnet cake --target=Test --target=Package --configuration=Release #--verbosity=diagnostic

    # Upload packages before publishing in case of later failures
    - name: 💾 Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Packages
        path: packages

    - name: Publish only if current commit is labeled
      run: |
        $tag = "$(git describe --tags --long)"
        $label = $tag.Substring(0,$tag.LastIndexOf("-", $tag.LastIndexOf("-")-1))
        echo "Most recent label: $label"
        $taginfo = $tag.Split("-")
        $height = $taginfo[-2]
        echo "Number of commits since label: $height"
        if ($height -eq "0")
        {
          dotnet cake --target=Publish --configuration=Release --nopush
        }
        else
        {
          echo "Skipping Publish Step"
        }

